function mean(a){const v=a.filter(x=>x!=null);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null;}
function toggleArr(arr,v,min=1){const i=arr.indexOf(v);if(i>=0){if(arr.length>min)arr.splice(i,1);}else arr.push(v);}
function periodInfo(p){
  if(p==="7d")return{labels:["06-25","06-26","06-27","06-28","06-29","06-30","07-01"],scale:1};
  if(p==="30d")return{labels:["Jun 3","Jun 10","Jun 17","Jun 24","Jul 1"],scale:1.8};
  return{labels:["Apr","May","Jun","Jul"],scale:3};
}
function gen(s,e,n){return Array.from({length:n},(_,i)=>{const t=i/(n-1);const base=s+(e-s)*t;const j=Math.sin(i*1.7)*(Math.abs(e-s)||1)*0.03;return +(base+j).toFixed(2);});}
function periodSentiment(name){const d=vocData[name];let score=d.score,dist={...d.dist};const tb=(trendBase["amazon.com"]||{})[name];if(tb&&tb.sentiment){const s=tb.sentiment[0],e=tb.sentiment[1];const f={"7d":1,"30d":0.6,"90d":0.3}[state.period];score=+(s+(e-s)*f).toFixed(2);const shift=Math.round((score-d.score)*120);dist={positive:Math.max(0,d.dist.positive+shift),neutral:d.dist.neutral,mixed:d.dist.mixed,negative:Math.max(0,d.dist.negative-shift)};}return {score,dist};}
function typeBadge(type){if(type===OWN)return `<span class="rounded-md border border-green-200 px-1.5 py-0.5 text-[10px] text-green-700">Own</span>`;if(type===COMP)return `<span class="rounded-md border border-purple-200 px-1.5 py-0.5 text-[10px] text-purple-700">Competitor</span>`;return `<span class="rounded-md border border-muted-foreground/30 px-1.5 py-0.5 text-[10px] text-muted-foreground">Unmatched</span>`;}
function sevDot(s){const c={critical:"bg-red-500",warning:"bg-amber-500",info:"bg-blue-500"}[s]||"bg-gray-400";return `<span class="inline-block size-2 rounded-full ${c}"></span>`;}
function sevBorder(s){return {critical:"border-l-red-500",warning:"border-l-amber-500",info:"border-l-blue-500"}[s]||"border-l-gray-400";}
function stars(n){return "★".repeat(n)+"☆".repeat(5-n);}
function featBadge(s){const c={positive:"border-green-200 text-green-700",negative:"border-red-200 text-red-700",mixed:"border-yellow-200 text-yellow-700"}[s];return `<span class="rounded-md border ${c} px-1.5 py-0.5 text-[10px]">${s}</span>`;}
function sentimentBar(dist){const total=dist.positive+dist.neutral+dist.mixed+dist.negative||1;const seg=[["positive","#22c55e",dist.positive],["neutral","#9ca3af",dist.neutral],["mixed","#facc15",dist.mixed],["negative","#ef4444",dist.negative]];const bars=seg.filter(s=>s[2]>0).map(s=>`<div style="width:${(s[2]/total*100).toFixed(1)}%;background:${s[1]}"></div>`).join("");const legend=seg.filter(s=>s[2]>0).map(s=>`<span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground"><span class="inline-block size-2 rounded-full" style="background:${s[1]}"></span>${s[0]} ${Math.round(s[2]/total*100)}%</span>`).join(" ");return `<div class="flex h-3 w-full overflow-hidden rounded-full">${bars}</div><div class="mt-1.5 flex flex-wrap gap-x-3 gap-y-1">${legend}</div>`;}

function renderTabbar(){el("tabbar").innerHTML=TABS.map(t=>`<button data-tab-btn data-tab="${t.k}" class="${state.tab===t.k?"active":""} flex items-center gap-1.5 whitespace-nowrap rounded-md px-3 py-1 text-xs font-medium transition">${t.label}${t.badge?`<span class="rounded bg-blue-100 px-1 text-[9px] font-bold text-blue-700">${t.badge}</span>`:""}</button>`).join("");}
function renderPeriod(){el("period").innerHTML=["7d","30d","90d"].map(p=>`<button data-period="${p}" class="rounded px-2 py-1 text-xs ${state.period===p?"bg-accent font-medium":"text-muted-foreground"}">${p}</button>`).join("");}

/* ================= CHART ================= */
function trendChart(lines,{labels,mode,axes}){
  if(!lines.length)return `<div class="flex items-center justify-center text-xs text-muted-foreground" style="height:200px">Select at least one product and one metric</div>`;
  const two=mode==="real"&&axes.length===2;
  const W=980,H=300,padL=54,padR=two?62:20,padT=16,padB=34,n=labels.length;
  const x=i=>padL+i*(W-padL-padR)/(n-1);
  const yReal=(v,ai)=>{const a=axes[ai];const t=(v-a.min)/((a.max-a.min)||1);return padT+(a.reversed?t:1-t)*(H-padT-padB);};
  const yIdx=(v,lo,hi,rev)=>{const t=(v-lo)/((hi-lo)||1);return padT+(rev?t:1-t)*(H-padT-padB);};
  let svg="";
  for(let g=0;g<=3;g++){const yy=padT+g*(H-padT-padB)/3;const ft=g/3;svg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-dasharray="4 4"/>`;
    if(mode==="real"){const a0=axes[0];const v0=a0.reversed?(a0.min+ft*(a0.max-a0.min)):(a0.max-ft*(a0.max-a0.min));svg+=`<text x="${padL-8}" y="${(yy+4).toFixed(1)}" font-size="12" fill="var(--muted-foreground)" text-anchor="end">${a0.fmt(v0)}</text>`;
      if(two){const a1=axes[1];const v1=a1.reversed?(a1.min+ft*(a1.max-a1.min)):(a1.max-ft*(a1.max-a1.min));svg+=`<text x="${(W-padR+8).toFixed(1)}" y="${(yy+4).toFixed(1)}" font-size="12" fill="var(--muted-foreground)" text-anchor="start">${a1.fmt(v1)}</text>`;}
    }else{svg+=`<text x="${padL-8}" y="${(yy+4).toFixed(1)}" font-size="12" fill="var(--muted-foreground)" text-anchor="end">${[100,66,33,0][g]}%</text>`;}}
  lines.forEach(l=>{let pts;if(mode==="real"){pts=l.data.map((v,i)=>[x(i),yReal(v,l.axis)]);}else{const lo=Math.min(...l.data),hi=Math.max(...l.data);pts=l.data.map((v,i)=>[x(i),yIdx(v,lo,hi,l.reversed)]);}const d=pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");svg+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2.5"${l.dash?' stroke-dasharray="5 4"':''}/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--background)" stroke="${l.color}" stroke-width="2"/>`).join("");});
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{svg+=`<text x="${x(i).toFixed(1)}" y="${H-10}" font-size="12" fill="var(--muted-foreground)" text-anchor="middle">${labels[i]||""}</text>`;});
  const legend=lines.map(l=>`<span class="inline-flex items-center gap-1.5 text-[11px] text-muted-foreground"><svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="${l.color}" stroke-width="2.5"${l.dash?' stroke-dasharray="4 3"':''}/></svg>${l.name} <span class="tabular font-medium text-foreground">${l.latest}</span></span>`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:auto;display:block">${svg}</svg><div class="mt-2 flex flex-wrap gap-x-4 gap-y-1">${legend}</div>`;
}
function miniLine(arr,{reversed=false,fmtY}={}){let mn=Math.min(...arr),mx=Math.max(...arr);if(mn===mx){mn-=1;mx+=1;}const ax={min:mn,max:mx,reversed,fmt:fmtY||(v=>Math.round(v).toString())};return trendChart([{name:"v",data:arr,color:"#2f7ed8",axis:0,reversed,latest:""}],{labels:periodInfo(state.period).labels,mode:"real",axes:[ax]}).replace(/<div class="mt-2[\s\S]*?<\/div>\s*$/,"");}

function statCard(label,val,suffix,trend,sub,invert){
  let col="text-muted-foreground",arrow="";if(trend!=null){const good=invert?trend<0:trend>0;col=trend===0?"text-muted-foreground":(good?"text-green-600":"text-red-600");arrow=trend>0?"↑":(trend<0?"↓":"");}

function healthTable(){

  const rows=products.map(p=>{
    const items=listings.filter(x=>p.listingIds.includes(x.id));const l=items.find(x=>x.marketplace==="amazon.com")||items[0];

      <td class="py-2 pr-3 text-right tabular">${price!=null?cur+Math.round(price):"—"}${dcell(dP,"neutral",v=>Math.round(v))}</td>

      <td class="py-2 pr-3 text-right tabular">${bsr?"#"+bsr:"—"}${dcell(dB,"down",v=>Math.round(v))}</td>

      <td class="py-2 pr-3 text-right tabular">${sent!=null?(sent>0?"+":"")+sent.toFixed(2):"—"}${dcell(dS,"up",v=>v.toFixed(2))}</td></tr>`;
  }).join("");
  return `<div class="overflow-x-auto rounded-lg border bg-card"><table class="w-full text-xs"><thead class="text-muted-foreground"><tr class="text-left"><th class="px-3 py-2 font-medium">Product line</th><th class="py-2 pr-3 text-right font-medium">Price</th><th class="py-2 pr-3 text-right font-medium">Rating</th><th class="py-2 pr-3 text-right font-medium">BSR</th><th class="py-2 pr-3 text-right font-medium">Reviews</th><th class="py-2 pr-3 text-right font-medium">Sentiment</th></tr></thead><tbody>${rows}</tbody></table></div>`;

function trendBlock(){
  const {labels,scale}=periodInfo(state.period);
  const market=state.trendMarket;const avail=Object.keys(trendBase[market]||{});
  let prods=state.trendProducts.filter(p=>avail.includes(p));
  if(!prods.length){prods=avail.filter(p=>OWN_SET.has(p));if(!prods.length)prods=avail.slice(0,1);state.trendProducts=prods.slice();}
  const metrics=state.trendMetrics;const nM=metrics.length;const sym=curSym(market);
  const mode=nM>2?"index":"real";
  const seriesFor=(p,mk)=>{const b=trendBase[market][p];if(!b||!b[mk])return null;const s2=b[mk][1]+(b[mk][0]-b[mk][1])*scale;return gen(s2,b[mk][1],labels.length);};
  const axes=[];
  if(mode==="real"){metrics.forEach(mk=>{const m=METRICS.find(x=>x.k===mk);const vals=[];prods.forEach(p=>{const s=seriesFor(p,mk);if(s)vals.push(...s);});let mn=Math.min(...vals),mx=Math.max(...vals);if(!isFinite(mn)||mn===mx){mn=(isFinite(mn)?mn:0)-1;mx=(isFinite(mx)?mx:0)+1;}axes.push({min:mn,max:mx,reversed:!!m.reversed,fmt:v=>m.fmt(v,sym),label:m.label});});}
  const prodColor={};let oi=0,ppi=0;prods.forEach(p=>{prodColor[p]=OWN_SET.has(p)?OWN_LINE[oi++%OWN_LINE.length]:COMP_LINE[ppi++%COMP_LINE.length];});
  const lines=[];
  prods.forEach(p=>{metrics.forEach((mk,mi)=>{const m=METRICS.find(x=>x.k===mk);const data=seriesFor(p,mk);if(!data)return;lines.push({name:shortName(p)+(nM>1?" · "+m.label:""),data,color:prodColor[p],dash:mode==="real"&&mi===1,axis:mode==="real"?mi:0,reversed:!!m.reversed,latest:m.fmt(data[data.length-1],sym)});});});
  const marketSel=`<select data-trendmarket class="h-8 rounded-md border bg-background px-2 text-xs">${MARKETS.filter(mk=>trendBase[mk]).map(mk=>`<option value="${mk}" ${market===mk?"selected":""}>${mk}</option>`).join("")}</select>`;
  const prodMenu=state.trendProdOpen?`<div class="absolute left-0 top-9 z-20 w-60 rounded-lg border bg-card p-1.5 shadow-lg">${avail.map(p=>{const on=prods.includes(p);const isOwn=OWN_SET.has(p);return `<label class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 text-xs hover:bg-muted"><input type="checkbox" data-trendprod-cb="${p}" ${on?"checked":""}><span class="size-2 rounded-full ${isOwn?"bg-green-500":"bg-purple-500"}"></span>${p}</label>`;}).join("")}</div>`:"";
  const prodBtn=`<div class="relative inline-block"><button data-act="trendprod" class="inline-flex h-8 items-center gap-1.5 rounded-md border px-2.5 text-xs hover:bg-accent">${prods.length} product${prods.length>1?"s":""} <span class="text-[8px]">▾</span></button>${prodMenu}</div>`;
  const metricCards=METRICS.map(m=>{const on=metrics.includes(m.k);return `<button data-trendmetric="${m.k}" class="rounded-md border px-3 py-1.5 text-xs ${on?"bg-accent font-medium":"text-muted-foreground"}">${m.label}</button>`;}).join("");
  let hint;
  if(nM===1)hint=`${axes[0].label} · ${market}`;
  else if(nM===2)hint=`Dual axis · left ${axes[0].label} (solid) · right ${axes[1].label} (dashed) · ${market}`;
  else hint=`${nM} metrics · units not comparable → indexed to each metric's own range, trend shape only · ${market}`;
  return `<div class="rounded-lg border bg-card p-4">
    <div class="mb-3 flex flex-wrap items-center gap-2"><span class="text-sm font-medium">Trends</span><span class="text-xs text-muted-foreground">· single marketplace</span><span class="ml-1 text-[10px] font-medium uppercase tracking-wide text-muted-foreground">Site</span>${marketSel}<span class="text-[10px] font-medium uppercase tracking-wide text-muted-foreground">Products</span>${prodBtn}</div>
    <div class="mb-3 flex flex-wrap items-center gap-1.5"><span class="mr-1 text-[10px] font-medium uppercase tracking-wide text-muted-foreground">Metrics</span>${metricCards}${nM>2?`<span class="ml-1 rounded bg-amber-50 px-1.5 py-0.5 text-[10px] text-amber-700">>2 metrics · trend only</span>`:""}</div>
    <div class="mb-1 text-xs text-muted-foreground">${hint}</div>
    ${trendChart(lines,{labels,mode,axes})}</div>`;
}

function viewListings(){

  function group(p,items,dashed){
    const mks=new Set(items.map(l=>l.marketplace));const ap=avg(items.map(l=>l.price)),ar=avg(items.map(l=>l.rating)),bb=Math.min(...items.map(l=>l.bsr).filter(Boolean));const rev=items.reduce((s,l)=>s+(l.reviews||0),0);
    // Folder header carries the current snapshot (price / rating / BSR / reviews). Sentiment intentionally omitted here — it lives in the product detail panel.
    return `<details class="rounded-lg border ${dashed?"border-dashed border-muted-foreground/30":""} px-3"><summary class="flex cursor-pointer list-none items-center justify-between py-3"><div class="min-w-0"><div class="flex items-center gap-2">${dashed?`<span class="text-sm font-medium text-muted-foreground">Unmatched</span>`:`<span class="text-sm font-medium">${p.name}</span>${typeBadge(p.type)}`}</div>${p.aliases&&p.aliases.length?`<div class="truncate text-[11px] text-muted-foreground">${p.aliases.join(" · ")}</div>`:""}
      <div class="mt-1 flex flex-wrap items-center gap-2 text-[11px] tabular"><span class="text-muted-foreground">${items.length} listing(s) · ${mks.size} market(s)</span>${ap!=null?`<span class="rounded bg-muted px-1.5 py-0.5 font-medium">avg $${ap.toFixed(0)}</span>`:""}${ar!=null?`<span class="rounded bg-muted px-1.5 py-0.5 font-medium">★${ar.toFixed(1)}</span>`:""}${isFinite(bb)?`<span class="rounded bg-muted px-1.5 py-0.5 font-medium">BSR #${bb}</span>`:""}${rev?`<span class="rounded bg-muted px-1.5 py-0.5 font-medium">${rev.toLocaleString()} reviews</span>`:""}</div>
      </div><span class="text-muted-foreground">▾</span></summary><div class="pb-3">${dashed?`<p class="mb-2 rounded-md border border-dashed border-muted-foreground/30 px-3 py-2 text-[11px] text-muted-foreground">Discovered but not yet matched to a product entity. Review in Brand Kit.</p>`:""}<div class="space-y-2">${items.map(listingCard).join("")}</div></div></details>`;
  }
  const groups=products.filter(p=>type==="all"||p.type===type).map(p=>({p,items:listings.filter(l=>p.listingIds.includes(l.id))})).filter(g=>g.items.length);
  const unmatched=(type==="all"||type==="competitor")?listings.filter(l=>l.type===null):[];
  const toolbar=`<div class="mb-3 flex flex-wrap items-center gap-2"><div class="flex items-center rounded-md border p-0.5">${["all","own","competitor"].map(t=>`<button data-cattype="${t}" class="rounded px-2 py-1 text-xs ${type===t?"bg-accent font-medium":"text-muted-foreground"}">${t==="all"?"All":t==="own"?"Own":"Competitor"}</button>`).join("")}</div><span class="text-xs text-muted-foreground">grouped by product (SPU) · all markets</span></div>`;
  const body=(groups.length||unmatched.length)?`<div class="space-y-2">${groups.map(g=>group(g.p,g.items,false)).join("")}${unmatched.length?group({name:"Unmatched",aliases:[]},unmatched,true):""}</div>`:`<div class="rounded-lg border bg-card py-12 text-center text-sm text-muted-foreground">No products in scope</div>`;
  return `<div><h3 class="mb-1 text-sm font-semibold">Product Catalog</h3><p class="mb-3 text-[11px] text-muted-foreground">SPU folders carry the current snapshot (price · rating · BSR · reviews); expand to see listings, click a listing for full detail incl. sentiment.</p>${toolbar}${body}</div>`;
}

/* ================= VOC (aspect-based; switch any product; per-product sentiment) ================= */
function reviewTriageCard(r,readonly){
  const impactCls=r.impact==="High"?"bg-red-100 text-red-700":"bg-amber-100 text-amber-700";const handled=r.status==="handled";
  const actions=readonly?"":`<div class="flex shrink-0 flex-col gap-1"><button data-review="reply" data-id="${r.id}" class="rounded-md border px-2 py-0.5 text-[11px] hover:bg-accent">Reply in Discussion ↗</button><button data-review="toggle" data-id="${r.id}" class="rounded-md border px-2 py-0.5 text-[11px] hover:bg-accent">${handled?"Reopen":"Mark handled"}</button></div>`;
  return `<div class="rounded-lg border border-l-[3px] border-l-red-500 bg-card p-3 ${handled?"opacity-60":""}"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="flex flex-wrap items-center gap-2 text-xs"><span class="text-amber-500">${stars(r.rating)}</span><span class="font-medium">${r.product}</span><span class="text-muted-foreground">· ${r.mk.toUpperCase()}</span>${r.verified?`<span class="rounded-md border border-green-200 px-1 text-[9px] text-green-700">Verified</span>`:""}<span class="rounded-full px-1.5 py-0.5 text-[10px] font-medium ${impactCls}">${r.impact} impact</span></div><p class="mt-1 text-sm">${r.body}</p><div class="mt-1 flex items-center gap-3 text-[10px] text-muted-foreground">👍 ${r.helpful} helpful · ${r.date}${handled?` · <span class="text-green-600">Handled</span>`:""}</div></div>${actions}</div></div>`;
}
function viewVoc(){
  const {scale}=periodInfo(state.period);const scope=state.vocScope;const d=vocData[scope];const ps=periodSentiment(scope);
  const ownOpts=vocOrder.filter(p=>vocData[p].own),compOpts=vocOrder.filter(p=>!vocData[p].own);
  const scopeSel=`<select data-vocscope class="h-8 rounded-md border bg-background px-2 text-xs"><optgroup label="Own">${ownOpts.map(p=>`<option value="${p}" ${scope===p?"selected":""}>${p}</option>`).join("")}</optgroup><optgroup label="Competitors">${compOpts.map(p=>`<option value="${p}" ${scope===p?"selected":""}>${p}</option>`).join("")}</optgroup></select>`;
  // strengths vs issues from the SAME aspect list (net polarity) — each aspect in exactly one column, no duplication. Single-color bars.
  const asp=d.aspects.map(a=>({...a,net:a.pos-a.neg}));
  const strengths=asp.filter(a=>a.net>=0).map(a=>({a:a.a,n:Math.round(a.pos*scale)})).sort((x,y)=>y.n-x.n);
  const issues=asp.filter(a=>a.net<0).map(a=>({a:a.a,n:Math.round(a.neg*scale)})).sort((x,y)=>y.n-x.n);
  const maxL=Math.max(...strengths.map(x=>x.n),1),maxI=Math.max(...issues.map(x=>x.n),1);
  const barRow=(x,max,color)=>`<div class="flex items-center gap-2 text-xs"><span class="w-40 shrink-0 truncate">${x.a}</span><div class="h-4 flex-1 rounded bg-muted"><div class="h-4 rounded" style="width:${(x.n/max*100).toFixed(0)}%;background:${color}"></div></div><span class="w-10 text-right tabular text-muted-foreground">${x.n}</span></div>`;
  const col=(title,tone,dot,items,max,color)=>`<div class="rounded-lg border bg-card p-4"><div class="mb-3 flex items-center gap-1.5 text-sm font-medium ${tone}">${dot} ${title} <span class="text-xs font-normal text-muted-foreground">(${items.length})</span></div><div class="space-y-2.5">${items.length?items.map(x=>barRow(x,max,color)).join(""):`<p class="text-xs text-muted-foreground">None</p>`}</div></div>`;
  // unmet needs & barriers (things that don't exist / reasons to hesitate) — distinct from aspect complaints
  const unmet=d.unmet.map(u=>({...u,n:Math.round(u.n*scale)})).sort((a,b)=>b.n-a.n);const maxU=Math.max(...unmet.map(u=>u.n),1);
  const unmetRows=unmet.map(u=>`<div class="flex items-center gap-2 text-xs"><span class="w-52 shrink-0 truncate">${u.t} <span class="rounded border px-1 text-[9px] ${u.kind==="request"?"border-blue-200 text-blue-700":"border-orange-200 text-orange-700"}">${u.kind}</span></span><div class="h-4 flex-1 rounded bg-muted"><div class="h-4 rounded ${u.kind==="request"?"bg-blue-500":"bg-orange-500"}" style="width:${(u.n/maxU*100).toFixed(0)}%"></div></div><span class="w-10 text-right tabular text-muted-foreground">${u.n}</span></div>`).join("");
  // triage — own products only
  let triageSection="";
  if(d.own){const triageAll=badReviews.filter(r=>r.product===scope);const sorted=[...triageAll].sort((a,b)=>(a.status==="handled")-(b.status==="handled")||b.helpful-a.helpful);const openCount=triageAll.filter(r=>r.status==="open").length;
    triageSection=`<div class="rounded-lg border bg-card p-4"><div class="mb-1 flex items-center justify-between"><div class="text-sm font-medium">High-Impact Negative Reviews</div><span class="text-xs text-muted-foreground">${openCount} open · sentiment × influence · replies go to Discussion</span></div><p class="mb-3 text-[11px] text-muted-foreground">Older items auto-expire; enabled by detail-level review data (helpful votes + semantics).</p><div class="space-y-2">${sorted.length?sorted.map(reviewTriageCard).join(""):`<p class="py-6 text-center text-xs text-muted-foreground">No reviews in scope</p>`}</div></div>`;
  }else{const compRevs=badReviews.filter(r=>r.product===scope).sort((a,b)=>b.helpful-a.helpful);
    triageSection=`<div class="rounded-lg border bg-card p-4"><div class="mb-1 flex items-center justify-between"><div class="text-sm font-medium">Top Negative Reviews <span class="text-xs font-normal text-muted-foreground">· competitor</span></div><span class="text-xs text-muted-foreground">read-only · benchmarking (no reply — not your product)</span></div><p class="mb-3 text-[11px] text-muted-foreground">What buyers dislike about ${scope} — a map of your differentiation opportunities.</p><div class="space-y-2">${compRevs.length?compRevs.map(r=>reviewTriageCard(r,true)).join(""):`<p class="py-6 text-center text-xs text-muted-foreground">No reviews in scope</p>`}</div></div>`;}
  const badge=d.own?'<span class="rounded border border-green-200 px-1 text-[9px] text-green-700">Own</span>':'<span class="rounded border border-purple-200 px-1 text-[9px] text-purple-700">Competitor</span>';
  return `<div class="mb-3 flex flex-wrap items-center gap-2 text-xs"><span class="text-muted-foreground">Product</span>${scopeSel}<span class="text-muted-foreground">unstructured customer voice · everything below reflects this product & the ${state.period} window</span></div>
  <div class="mb-4 rounded-lg border bg-card p-4">
    <div class="mb-2 flex items-center gap-2"><span class="text-[10px] font-medium uppercase tracking-wide text-muted-foreground">Sentiment</span><span class="text-xs font-medium">(${(ps.score>0?"+":"")+ps.score.toFixed(2)})</span>${badge}<span class="ml-auto text-[10px] text-muted-foreground">${state.period} window</span></div>
    ${sentimentBar(ps.dist)}
  </div>
  <div class="mb-4 grid gap-4 md:grid-cols-2">
    ${col("What users love","text-green-700",'<span class="text-green-600">▲</span>',strengths,maxL,"#22c55e")}
    ${col("What users complain about","text-red-700",'<span class="text-red-600">▼</span>',issues,maxI,"#ef4444")}
  </div>
  <div class="mb-4 rounded-lg border bg-card p-4"><div class="mb-3 text-sm font-medium">Unmet needs & purchase barriers <span class="text-xs font-normal text-muted-foreground">· what's missing / why they hesitate (distinct from complaints)</span></div><div class="space-y-2">${unmetRows}</div></div>
  ${triageSection}`;
}

/* ================= DETAIL PANEL ================= */
function openDetail(id){
  const l=listings.find(x=>x.id===id);if(!l)return;
  el("detailHeader").innerHTML=`<span class="truncate text-sm font-semibold">${l.name}</span>${typeBadge(l.type)}`;
  const cell=(lb,v)=>`<div class="rounded-lg bg-muted/40 px-3 py-2"><p class="mb-0.5 text-[10px] font-medium uppercase tracking-wide text-muted-foreground">${lb}</p><div class="text-sm font-medium">${v??'<span class="text-muted-foreground/60">—</span>'}</div></div>`;
  const price=l.price!=null?`${l.currency} ${l.price.toFixed(2)}`:null;
  const grid=`<div class="grid grid-cols-2 gap-2">${cell("Price",price)}${cell("Rating",l.rating!=null?`★ ${l.rating.toFixed(1)}`:null)}${cell("BSR Rank",l.bsr?`#${l.bsr.toLocaleString()} <span class="text-[10px] text-muted-foreground">${l.bsrCat}</span>`:null)}${cell("Reviews",l.reviews!=null?l.reviews.toLocaleString():null)}${cell("Stock",`<span class="${l.stock?"text-green-600":"text-red-600"}">${l.stock?"In Stock":"Out of Stock"}</span>`)}${l.coupon?cell("Coupon",`<span class="text-orange-600">${l.coupon}</span>`):""}</div>`;
  const b=(trendBase[l.marketplace]||{})[l.product];const n=periodInfo(state.period).labels.length;
  const pt=b?gen(b.price[0],b.price[1],n):Array(n).fill(l.price);
  const bt=b?gen(b.bsr[0],b.bsr[1],n):(l.bsr?Array(n).fill(l.bsr):Array(n).fill(0));
  const rt=b?gen(b.rating[0],b.rating[1],n):Array(n).fill(l.rating);
  const trends=`<div class="space-y-3"><div class="rounded-lg border p-3"><p class="mb-1 text-[10px] font-medium uppercase text-muted-foreground">Price</p>${miniLine(pt,{fmtY:v=>(l.currency||"$")+Math.round(v)})}</div><div class="rounded-lg border p-3"><p class="mb-1 text-[10px] font-medium uppercase text-muted-foreground">BSR Rank</p>${miniLine(bt,{reversed:true,fmtY:v=>"#"+Math.round(v)})}</div><div class="rounded-lg border p-3"><p class="mb-1 text-[10px] font-medium uppercase text-muted-foreground">Rating</p>${miniLine(rt,{fmtY:v=>v.toFixed(1)})}</div></div>`;
  let review=`<p class="text-sm text-muted-foreground">No review analysis for this listing</p>`;
  if(l.review){const r=l.review;review=`<div class="space-y-4"><div><p class="mb-2 text-[10px] font-medium uppercase text-muted-foreground">Sentiment <span class="normal-case">(${r.score>0?"+":""}${r.score.toFixed(2)})</span></p>${sentimentBar(r.dist)}</div><div><p class="mb-2 text-[10px] font-medium uppercase text-muted-foreground">Top Topics</p><div class="flex flex-wrap gap-1.5">${r.topics.map(t=>`<span class="rounded-md bg-secondary px-2 py-0.5 text-xs">${t}</span>`).join("")}</div></div><div><p class="mb-2 text-[10px] font-medium uppercase text-muted-foreground">Feature Sentiment</p><div class="space-y-1.5">${r.features.map(f=>`<div class="flex items-center justify-between gap-2"><span class="truncate text-sm">${f.f}</span><div class="flex items-center gap-2">${featBadge(f.s)}<span class="text-xs text-muted-foreground tabular">${f.m}x</span></div></div>`).join("")}</div></div><div><p class="mb-2 text-[10px] font-medium uppercase text-muted-foreground">Key Issues</p><ul class="space-y-1">${r.issues.map(i=>`<li class="flex items-start gap-2 text-sm"><span class="mt-1.5 size-1.5 shrink-0 rounded-full bg-red-500"></span>${i}</li>`).join("")}</ul></div><div><p class="mb-2 text-[10px] font-medium uppercase text-muted-foreground">Highlights</p><ul class="space-y-1">${r.highlights.map(i=>`<li class="flex items-start gap-2 text-sm"><span class="mt-1.5 size-1.5 shrink-0 rounded-full bg-green-500"></span>${i}</li>`).join("")}</ul></div>${r.competitors&&r.competitors.length?`<div><p class="mb-2 text-[10px] font-medium uppercase text-muted-foreground">Competitor Mentions</p><div class="flex flex-wrap gap-1.5">${r.competitors.map(c=>`<span class="rounded-md border px-2 py-0.5 text-xs">${c}</span>`).join("")}</div></div>`:""}</div>`;}
  let meta="";
  if(l.specs){meta=`<details class="rounded-lg"><summary class="cursor-pointer list-none text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Metadata ▾</summary><div class="mt-3 space-y-3"><div><p class="mb-1 text-[10px] uppercase text-muted-foreground">Tech Specs</p><div class="space-y-1">${Object.entries(l.specs).map(([k,v])=>`<div class="flex gap-2 text-xs"><span class="min-w-[90px] shrink-0 text-muted-foreground">${k}</span><span>${v}</span></div>`).join("")}</div></div>${l.variants?`<div><p class="mb-1 text-[10px] uppercase text-muted-foreground">Variants (${l.variants.length})</p><div class="flex flex-wrap gap-1.5">${l.variants.map(v=>`<span class="rounded-md border px-1.5 py-0.5 text-[10px]">${v}</span>`).join("")}</div></div>`:""}${l.buybox?`<div><p class="mb-1 text-[10px] uppercase text-muted-foreground">Buybox Offers (${l.buybox.length})</p><div class="space-y-1">${l.buybox.map(o=>`<div class="flex justify-between text-xs"><span class="text-muted-foreground">${o.s}</span><span class="font-medium">${l.currency} ${o.p}</span></div>`).join("")}</div></div>`:""}</div></details>`;}
  el("detailBody").innerHTML=`<div class="space-y-6"><section><h4 class="mb-3 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Current State</h4>${grid}</section><section><h4 class="mb-3 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Snapshot Trend</h4>${trends}</section><section><h4 class="mb-3 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Review Analysis</h4>${review}</section>${meta?`<section>${meta}</section>`:""}</div>`;
  el("detailOverlay").classList.remove("hidden");const p=el("detailPanel");p.classList.remove("hidden");requestAnimationFrame(()=>p.style.transform="translateX(0)");
}
function closeDetail(){const p=el("detailPanel");p.style.transform="translateX(100%)";el("detailOverlay").classList.add("hidden");setTimeout(()=>p.classList.add("hidden"),200);}

/* ================= SETTINGS (coverage + monitoring[admin] + notifications) ================= */
function renderMon(){
  el("monBody").innerHTML=`
  <div class="border-b px-4 py-3"><div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">Coverage</div>
    <div class="mt-2 space-y-2">
      <div class="flex items-start gap-2 rounded-lg border-l-[3px] border-l-green-500 bg-muted/30 px-3 py-2"><div class="text-xs"><div class="font-medium">Own coverage</div><div class="text-muted-foreground">2 products · 3 listings · 2 markets</div></div></div>
      <div class="flex items-start gap-2 rounded-lg border-l-[3px] border-l-purple-500 bg-muted/30 px-3 py-2"><div class="text-xs"><div class="font-medium">Competitor coverage</div><div class="text-muted-foreground">2 competitors · 3 listings · 2 markets · 1 pending</div></div></div>
      <div class="text-[10px] text-muted-foreground">Last sync 2h ago</div>
    </div></div>
  <div class="border-b px-4 py-3"><div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">Monitoring</div><div class="mt-2 flex items-center justify-between rounded-lg bg-muted/40 px-3 py-2 text-sm"><span>Status</span><span class="flex items-center gap-2"><b class="text-green-600">On</b><span class="rounded border px-1 text-[10px] text-muted-foreground">managed by admin</span></span></div><p class="mt-1 px-1 text-[10px] text-muted-foreground">Enabling/disabling monitoring is controlled by your organization admin.</p></div>
  <div class="border-b px-4 py-3"><div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">Notifications</div><div class="mt-2 space-y-1.5 text-sm"><label class="flex items-center justify-between rounded-lg px-2 py-1"><span>Email</span><input type="checkbox" data-notify="email" ${state.notifyEmail?"checked":""}></label><label class="flex items-center justify-between rounded-lg px-2 py-1"><span>Feishu</span><input type="checkbox" data-notify="feishu" ${state.notifyFeishu?"checked":""}></label></div><p class="mt-1 px-2 text-[10px] text-muted-foreground">Notify me on critical signals</p></div>
  <div class="px-4 py-3"><button data-act="brandkit" class="flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground">↗ Manage products in Brand Kit</button></div>`;
}
function openMon(){renderMon();el("monOverlay").classList.remove("hidden");const p=el("monPanel");p.classList.remove("hidden");requestAnimationFrame(()=>p.style.transform="translateX(0)");}
function closeMon(){const p=el("monPanel");p.style.transform="translateX(100%)";el("monOverlay").classList.add("hidden");setTimeout(()=>p.classList.add("hidden"),200);}

/* ================= RENDER + EVENTS ================= */
function render(){renderTabbar();renderPeriod();el("platform").value=state.platform;const views={overview:viewOverview,listings:viewListings,voc:viewVoc};el("content").innerHTML=(views[state.tab]||viewOverview)();}
document.addEventListener("click",(e)=>{
  const t=e.target.closest("[data-tab-btn],[data-listing],[data-act],[data-sigact],[data-cattype],[data-trendmetric],[data-period],[data-review]");
  if(!t)return;
  if(t.hasAttribute("data-tab-btn")){state.tab=t.getAttribute("data-tab");render();return;}
  if(t.hasAttribute("data-period")){state.period=t.getAttribute("data-period");render();return;}
  if(t.dataset.listing){openDetail(t.dataset.listing);return;}
  if(t.dataset.cattype){state.catType=t.dataset.cattype;render();return;}
  if(t.dataset.trendmetric){toggleArr(state.trendMetrics,t.dataset.trendmetric);render();return;}
  if(t.dataset.sigact){const s=signals.find(x=>x.id===t.dataset.id);if(s){s.status={ack:"acknowledged",resolve:"resolved",reopen:"active"}[t.dataset.sigact];toast("Signal updated");render();}return;}
  if(t.dataset.review){const r=badReviews.find(x=>x.id===t.dataset.id);if(!r)return;if(t.dataset.review==="toggle"){r.status=r.status==="handled"?"open":"handled";toast(r.status==="handled"?"Marked handled":"Reopened");render();}else toast("Routing to Discussion to reply (demo)");return;}
  const act=t.dataset.act;
  if(act==="sync")toast("Product data synced ✓");
  if(act==="discover")toast("Discovered 1 new listing ✓");
  if(act==="sigmore"){state.sigExpanded=!state.sigExpanded;render();}
  if(act==="trendprod"){state.trendProdOpen=!state.trendProdOpen;render();}
  if(act==="settings")openMon();
  if(act==="closeDetail")closeDetail();
  if(act==="closeMon")closeMon();
  if(act==="brandkit")toast("Opening Brand Kit (demo)");
});
el("detailOverlay").addEventListener("click",closeDetail);
el("monOverlay").addEventListener("click",closeMon);
document.addEventListener("change",(e)=>{const t=e.target;
  if(t.id==="platform"){state.platform=t.value;render();}
  if(t.matches&&t.matches("[data-trendmarket]")){state.trendMarket=t.value;const av=Object.keys(trendBase[t.value]||{});state.trendProducts=av.filter(p=>OWN_SET.has(p));if(!state.trendProducts.length)state.trendProducts=av.slice(0,1);state.trendProdOpen=false;render();}
  if(t.matches&&t.matches("[data-trendprod-cb]")){toggleArr(state.trendProducts,t.getAttribute("data-trendprod-cb"),1);render();}
  if(t.matches&&t.matches("[data-standown]")){state.standingOwn=t.value;render();}
  if(t.matches&&t.matches("[data-standcomp]")){state.standingComp=t.value;render();}
  if(t.matches&&t.matches("[data-vocscope]")){state.vocScope=t.value;render();}
  if(t.dataset.notify){if(t.dataset.notify==="email")state.notifyEmail=t.checked;else state.notifyFeishu=t.checked;toast("Notification settings updated");}
});
render();
</script>
