function momArrow(m){if(m>0)return `<span class="text-[10px] text-green-600">↑${m}%</span>`;if(m<0)return `<span class="text-[10px] text-red-600">↓${Math.abs(m)}%</span>`;return `<span class="text-[10px] text-muted-foreground">0%</span>`;}
function sentimentBar(dist){const total=dist.positive+dist.neutral+dist.mixed+dist.negative||1;const seg=[["positive","#22c55e",dist.positive],["neutral","#9ca3af",dist.neutral],["mixed","#facc15",dist.mixed],["negative","#ef4444",dist.negative]];const bars=seg.filter(s=>s[2]>0).map(s=>`<div style="width:${(s[2]/total*100).toFixed(1)}%;background:${s[1]}"></div>`).join("");const legend=seg.filter(s=>s[2]>0).map(s=>`<span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground"><span class="inline-block size-2 rounded-full" style="background:${s[1]}"></span>${s[0]} ${Math.round(s[2]/total*100)}%</span>`).join(" ");return `<div class="flex h-3 w-full overflow-hidden rounded-full">${bars}</div><div class="mt-1.5 flex flex-wrap gap-x-3 gap-y-1">${legend}</div>`;}
function netFromDist(d){const t=d.positive+d.neutral+d.mixed+d.negative||1;return (d.positive-d.negative)/t;}
function ownerOf(shares){return Object.entries(shares).sort((a,b)=>b[1]-a[1])[0][0];}
function shareBar(shares){const order=ENT.map(e=>e.name).filter(n=>shares[n]!=null);const tot=order.reduce((s,n)=>s+shares[n],0)||1;return `<div class="flex h-2.5 w-full overflow-hidden rounded-full">${order.map(n=>`<div title="${n} ${Math.round(shares[n]/tot*100)}%" style="width:${(shares[n]/tot*100).toFixed(1)}%;background:${ENTC[n].color}"></div>`).join("")}</div>`;}
function influenceScore(p){const f=Math.max(0,Math.log10(p.followers)-3);const s=(p.sent+1);return Math.max(1,Math.min(10,Math.round(f*2.2+s*1.6+p.mentions*0.08)));}

function lineChart(series,{fmtY,colors,reversed=false,area=false}={}){
  const names=Object.keys(series);if(!names.length)return `<div class="flex items-center justify-center text-xs text-muted-foreground" style="height:180px">No data</div>`;
  const labels=periodInfo(state.period).labels;const all=names.flatMap(n=>series[n]);let min=Math.min(...all),max=Math.max(...all);if(min===max){min-=1;max+=1;}
  const W=980,H=280,padL=54,padR=18,padT=16,padB=32,n=series[names[0]].length;
  const x=i=>padL+i*(W-padL-padR)/(n-1);const y=v=>{const t=(v-min)/(max-min);return padT+(reversed?t:1-t)*(H-padT-padB);};
  let svg="";
  for(let g=0;g<=3;g++){const yy=padT+g*(H-padT-padB)/3;const ft=g/3;const val=reversed?(min+ft*(max-min)):(max-ft*(max-min));svg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-dasharray="4 4"/><text x="${padL-8}" y="${(yy+4).toFixed(1)}" font-size="12" fill="var(--muted-foreground)" text-anchor="end">${fmtY(val)}</text>`;}
  names.forEach(nm=>{const c=(colors&&colors[nm])||"#2f7ed8";const pts=series[nm].map((v,i)=>[x(i),y(v)]);const d=pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");if(area){const base=H-padB;svg+=`<path d="${d} L${pts[pts.length-1][0].toFixed(1)},${base} L${pts[0][0].toFixed(1)},${base} Z" fill="${c}" fill-opacity="0.10"/>`;}svg+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--background)" stroke="${c}" stroke-width="2"/>`).join("");});
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{svg+=`<text x="${x(i).toFixed(1)}" y="${H-9}" font-size="12" fill="var(--muted-foreground)" text-anchor="middle">${labels[i]||""}</text>`;});
  const legend=names.map(nm=>`<span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground"><span class="inline-block size-2 rounded-full" style="background:${(colors&&colors[nm])||"#2f7ed8"}"></span>${nm} <span class="tabular font-medium text-foreground">${fmtY(series[nm][series[nm].length-1])}</span></span>`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:auto;display:block">${svg}</svg><div class="mt-2 flex flex-wrap gap-x-4 gap-y-1">${legend}</div>`;
}

function resample(a,n){if(n>=a.length)return a.slice();const step=(a.length-1)/(n-1);return Array.from({length:n},(_,i)=>a[Math.round(i*step)]);}
function mentionsChart(clickable=true,forceMode){

  const path=(arr,yf,c)=>{const pts=arr.map((v,i)=>[x(i),yf(v)]);return `<path d="${pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--background)" stroke="${c}" stroke-width="2"/>`).join('');};

  labels.forEach((lb,i)=>{const selc=clickable&&state.mentDay===lb;svg+=`<rect ${clickable?`data-day="${lb}"`:""} data-hoveridx="${i}" data-lbl="${lb}" data-n1="${pn}" data-v1="${fmtP(prim[i])}" data-c1="${cP}"${sec?` data-n2="${sn}" data-v2="${fmtS(sec[i])}" data-c2="${cS}"`:""} x="${(x(i)-colW/2).toFixed(1)}" y="${padT}" width="${colW.toFixed(1)}" height="${(H-padT-padB).toFixed(1)}" fill="#3b82f6" fill-opacity="${selc?0.12:0}" stroke="${selc?'#3b82f6':'transparent'}" stroke-dasharray="3 3" style="cursor:pointer"></rect>`;});
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{svg+=`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">${labels[i]||''}</text>`;});
  const lg=(c,t)=>`<span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground"><span class="inline-block h-0.5 w-3" style="background:${c}"></span>${t}</span>`;
  const legend=lg(cP,pn)+(sec?" "+lg(cS,sn):"");
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:auto;display:block">${svg}</svg><div class="mt-1 flex gap-3">${legend}</div>`;
}

function card(title,inner,sub){return `<div class="rounded-lg border bg-card p-4"><div class="mb-3 text-sm font-medium">${title}${sub?` <span class="text-xs font-normal text-muted-foreground">· ${sub}</span>`:""}</div>${inner}</div>`;}
const OVM={mentions:{label:"Mentions",series:socialDaily.mentions,color:"#1d9bf0",fmt:fmtCount},reach:{label:"Reach",series:socialDaily.reach,color:"#16a34a",fmt:fmtCount},sentiment:{label:"Sentiment",series:socialDaily.net,color:"#a855f7",fmt:v=>(+v).toFixed(2)},sov:{label:"SOV",series:socialDaily.sov,color:"#f59e0b",fmt:pct}};
function trendMulti(){
  const {labels}=periodInfo(state.period);const n=labels.length;
  const ms=state.ovMetrics.length?state.ovMetrics:["mentions"];const two=ms.length===2;const mode=ms.length>2?"index":"real";
  const W=920,H=240,padL=48,padR=two?56:18,padT=16,padB=28;
  const x=i=>padL+i*(W-padL-padR)/((n-1)||1);
  const selPM=PLATFORMS.filter(p=>state.platforms.includes(p.k)).reduce((s,p)=>s+((platBreak[p.k]||{}).mentions||0),0);
  const allPM=PLATFORMS.reduce((s,p)=>s+((platBreak[p.k]||{}).mentions||0),0)||1;const pf=selPM/allPM;
  const lines=ms.map((k,idx)=>{const sc=(k==="mentions"||k==="reach")?pf:1;return {k,label:OVM[k].label,color:OVM[k].color,fmt:OVM[k].fmt,data:resample(OVM[k].series,n).map(v=>v*sc),axis:(two&&idx===1)?1:0};});
  let ax0,ax1;
  if(mode==="real"){const a0=lines.filter(l=>l.axis===0).flatMap(l=>l.data);ax0={min:Math.min(...a0),max:Math.max(...a0)*1.05};if(ax0.min===ax0.max){ax0.min-=1;ax0.max+=1;}if(two){const a1=lines.filter(l=>l.axis===1).flatMap(l=>l.data);ax1={min:Math.min(...a1),max:Math.max(...a1)*1.05};if(ax1.min===ax1.max){ax1.min-=1;ax1.max+=1;}}}
  const yR=(v,a)=>padT+(1-(v-a.min)/((a.max-a.min)||1))*(H-padT-padB);
  const yI=(v,lo,hi)=>padT+(1-(v-lo)/((hi-lo)||1))*(H-padT-padB);
  let svg="";
  for(let g=0;g<=3;g++){const yy=padT+g*(H-padT-padB)/3;svg+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-dasharray="4 4"/>`;
    if(mode==="real"){const l0=lines.find(l=>l.axis===0);svg+=`<text x="${padL-6}" y="${(yy+4).toFixed(1)}" font-size="11" fill="${l0.color}" text-anchor="end">${l0.fmt(ax0.max-(ax0.max-ax0.min)*g/3)}</text>`;if(two){const l1=lines.find(l=>l.axis===1);svg+=`<text x="${(W-padR+6).toFixed(1)}" y="${(yy+4).toFixed(1)}" font-size="11" fill="${l1.color}" text-anchor="start">${l1.fmt(ax1.max-(ax1.max-ax1.min)*g/3)}</text>`;}}
    else svg+=`<text x="${padL-6}" y="${(yy+4).toFixed(1)}" font-size="11" fill="var(--muted-foreground)" text-anchor="end">${[100,66,33,0][g]}%</text>`;}
  lines.forEach(l=>{let pts;if(mode==="real"){const a=l.axis===1?ax1:ax0;pts=l.data.map((v,i)=>[x(i),yR(v,a)]);}else{const lo=Math.min(...l.data),hi=Math.max(...l.data);pts=l.data.map((v,i)=>[x(i),yI(v,lo,hi)]);}svg+=`<path d="${pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="none" stroke="${l.color}" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--background)" stroke="${l.color}" stroke-width="2"/>`).join('');});
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{svg+=`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">${labels[i]||''}</text>`;});
  const legend=lines.map(l=>`<span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground"><span class="inline-block h-0.5 w-3" style="background:${l.color}"></span>${l.label} <span class="tabular font-medium text-foreground">${l.fmt(l.data[l.data.length-1])}</span></span>`).join(" ");
  const hint=mode==="index"?`<span class="ml-2 text-[10px] text-amber-700">indexed · trend shape only</span>`:(two?`<span class="ml-2 text-[10px] text-muted-foreground">dual axis</span>`:"");
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:auto;display:block">${svg}</svg><div class="mt-1 flex flex-wrap items-center gap-x-4 gap-y-1">${legend}${hint}</div>`;
}
function donut(items){const tot=items.reduce((s,i)=>s+i.value,0)||1;let a=-Math.PI/2;const R=42,r=26,cx=50,cy=50;let paths="";items.forEach(it=>{const frac=it.value/tot;if(frac<=0)return;const a2=a+frac*2*Math.PI;const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);const xi1=cx+r*Math.cos(a2),yi1=cy+r*Math.sin(a2),xi2=cx+r*Math.cos(a),yi2=cy+r*Math.sin(a);const large=frac>0.5?1:0;paths+=`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${xi1.toFixed(2)},${yi1.toFixed(2)} A${r},${r} 0 ${large} 0 ${xi2.toFixed(2)},${yi2.toFixed(2)} Z" fill="${it.color}"/>`;a=a2;});const legend=items.filter(i=>i.value>0).sort((a,b)=>b.value-a.value).map(i=>`<div class="flex items-center justify-between gap-3 text-xs"><span class="inline-flex items-center gap-1.5 text-muted-foreground"><span class="size-2.5 rounded-full" style="background:${i.color}"></span>${i.label}</span><span class="tabular font-medium">${Math.round(i.value/tot*100)}%</span></div>`).join("");return `<div class="flex items-center gap-5"><svg viewBox="0 0 100 100" class="h-32 w-32 shrink-0">${paths}</svg><div class="flex-1 space-y-1.5">${legend}</div></div>`;}
function gauge(val,max,center,note){const frac=Math.max(0,Math.min(1,val/max));const R=40,cx=50,cy=50;const arc=(s,e,c)=>{const x1=cx+R*Math.cos(s),y1=cy+R*Math.sin(s),x2=cx+R*Math.cos(e),y2=cy+R*Math.sin(e);const large=(e-s)>Math.PI?1:0;return `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/>`;};return `<svg viewBox="0 0 100 58" class="mx-auto w-40">${arc(Math.PI,2*Math.PI,'var(--border)')}${arc(Math.PI,Math.PI+frac*Math.PI,'#22c55e')}<text x="50" y="48" font-size="20" font-weight="bold" fill="var(--foreground)" text-anchor="middle">${center}</text></svg>${note?`<p class="mt-1 text-center text-[10px] text-muted-foreground">${note}</p>`:""}`;}
function heatmap(){
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const hourLabel=h=>{const ap=h<12?"AM":"PM";let hh=h%12;if(hh===0)hh=12;return hh+ap;};
  let pk={v:-1,d:0,h:0};hotHours.forEach((row,d)=>row.forEach((v,h)=>{if(v>pk.v)pk={v,d,h};}));
  const modeSeg=`<div class="flex items-center rounded-md border p-0.5">${["mentions","reach","interactions"].map(m=>`<button data-hotmode="${m}" class="rounded px-2 py-0.5 text-[11px] capitalize ${state.hotMode===m?"bg-accent font-medium":"text-muted-foreground"}">${m}</button>`).join("")}</div>`;
  const hdr=`<div class="flex items-center gap-[2px]"><span class="w-7 shrink-0"></span><div class="flex flex-1 justify-between text-[8px] text-muted-foreground">${["12A","3A","6A","9A","12P","3P","6P","9P","11P"].map(l=>`<span>${l}</span>`).join("")}</div></div>`;
  const grid=days.map((d,di)=>`<div class="flex items-center gap-[2px]"><span class="w-7 shrink-0 text-[9px] text-muted-foreground">${d}</span>${hotHours[di].map((v,h)=>`<span title="${d} ${hourLabel(h)} · ${Math.round(v*300)} ${state.hotMode}" class="inline-block size-3 shrink-0 rounded-full" style="background:${v<0.12?'var(--muted)':'#6d28d9'};opacity:${v<0.12?1:(0.2+v*0.8).toFixed(2)}"></span>`).join("")}</div>`).join("");
  return `<div><div class="mb-2 flex flex-wrap items-center justify-between gap-2"><select class="h-7 rounded-md border bg-background px-2 text-[11px]"><option>Asia/Singapore (GMT+8)</option><option>UTC</option><option>US/Pacific</option></select>${modeSeg}</div><p class="mb-3 text-center text-[11px] text-muted-foreground">Most ${state.hotMode} on <b>${days[pk.d]}</b> at <b>${hourLabel(pk.h)}</b></p><div class="overflow-x-auto pb-1"><div class="min-w-[360px] space-y-[3px]">${hdr}${grid}</div></div><div class="mt-2 flex items-center justify-center gap-2 text-[9px] text-muted-foreground"><span>Lowest</span><span class="inline-block h-2 w-16 rounded-full" style="background:linear-gradient(90deg,var(--muted),#6d28d9)"></span><span>Largest</span></div></div>`;
}

function kpi(label,val,sub,delta,dfmt,invert){

  const dv=delta==null?"":`<span class="ml-auto text-xs ${col}">${ar} ${dfmt(Math.abs(delta))}</span>`;

}

function compChart(){

  const CM={mentions:{label:"Mentions",fmt:fmtCount},reach:{label:"Reach",fmt:fmtCount},sentiment:{label:"Net sent.",fmt:v=>(+v).toFixed(2)},sov:{label:"SOV",fmt:pct}};
  const ua=ENT.filter(e=>state.compEntities.includes(e.name));const uE=ua.length?ua:[ENT[0]];
  const ms=state.compMetrics.length?state.compMetrics:["mentions"];const nM=ms.length,two=nM===2,mode=nM>2?"index":"real";
  const W=920,H=260,padL=48,padR=two?56:18,padT=16,padB=28;const x=i=>padL+i*(W-padL-padR)/((n-1)||1);
  const ser=(en,mk)=>{const bb=entTrend[en][mk];const s2=bb[1]+(bb[0]-bb[1])*scale;return gen(s2,bb[1],n);};

    if(mode==="real"){svg+=`<text x="${padL-6}" y="${(yy+4).toFixed(1)}" font-size="11" fill="var(--muted-foreground)" text-anchor="end">${axes[0].fmt(axes[0].max-(axes[0].max-axes[0].min)*g/3)}</text>`;if(two)svg+=`<text x="${(W-padR+6).toFixed(1)}" y="${(yy+4).toFixed(1)}" font-size="11" fill="var(--muted-foreground)" text-anchor="start">${axes[1].fmt(axes[1].max-(axes[1].max-axes[1].min)*g/3)}</text>`;}

  [0,Math.floor((n-1)/2),n-1].forEach(i=>{svg+=`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">${labels[i]||''}</text>`;});
  const legend=lines.map(l=>`<span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground"><svg width="16" height="6"><line x1="0" y1="3" x2="16" y2="3" stroke="${l.color}" stroke-width="2.5"${l.dash?' stroke-dasharray="4 3"':''}/></svg>${l.name}</span>`).join(" ");

}

  // ---- Compare entities ----
  const metrics=[["Total mentions",e=>fmtCount(entTrend[e].mentions[1])],["Reach",e=>fmtCount(entTrend[e].reach[1])],["Net sentiment",e=>(entTrend[e].sentiment[1]>0?'+':'')+entTrend[e].sentiment[1].toFixed(2)],["Share of Voice",e=>pct(entTrend[e].sov[1])]];
  const ovHead=`<th class="px-3 py-2 text-left font-medium">Metric</th>${ENT.map(e=>`<th class="py-2 pr-3 text-right font-medium"><span class="inline-flex items-center gap-1"><span class="size-2 rounded-full" style="background:${e.color}"></span>${e.name}</span></th>`).join("")}`;
  const ovRows=metrics.map(([lb,fn])=>`<tr class="border-t"><td class="px-3 py-2">${lb}</td>${ENT.map(e=>`<td class="py-2 pr-3 text-right tabular ${e.type==='own'?'font-medium':''}">${fn(e.name)}</td>`).join("")}</tr>`).join("");
  const sovMentions=ENT.map(e=>({label:e.name,value:entTrend[e.name].mentions[1],color:e.color}));
  const sovReach=ENT.map(e=>({label:e.name,value:entTrend[e.name].reach[1],color:e.color}));
  const CM2={mentions:"Mentions",reach:"Reach",sentiment:"Net sent.",sov:"SOV"};
  const metricSeg=`<div class="flex items-center rounded-md border p-0.5">${Object.keys(CM2).map(k=>`<button data-compmetric="${k}" class="rounded px-2 py-1 text-xs ${state.compMetrics.includes(k)?"bg-accent font-medium":"text-muted-foreground"}">${CM2[k]}</button>`).join("")}</div>`;
  const entChips=ENT.map(e=>`<button data-compent="${e.name}" class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs ${state.compEntities.includes(e.name)?"bg-accent font-medium":"text-muted-foreground"}"><span class="size-2 rounded-full" style="background:${e.color}"></span>${e.name}</button>`).join("");
  const trendCard=`<div class="rounded-lg border bg-card p-4"><div class="mb-2 flex flex-wrap items-center justify-between gap-2"><span class="text-sm font-medium">Trend comparison <span class="text-xs font-normal text-muted-foreground">· multi-brand × multi-metric</span></span>${metricSeg}</div><div class="mb-3 flex flex-wrap gap-1.5">${entChips}</div>${compChart()}</div>`;
  return `<div class="flex flex-col gap-6">
    <div class="flex flex-wrap items-center gap-2">${modeSeg}<span class="text-xs text-muted-foreground">own vs competitors · entity-native</span></div>
    ${card("Overview",`<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-muted-foreground"><tr>${ovHead}</tr></thead><tbody>${ovRows}</tbody></table></div>`)}
    ${trendCard}
    <div class="grid gap-4 lg:grid-cols-2">${card("Share of Voice · Mentions",donut(sovMentions))}${card("Share of Voice · Reach",donut(sovReach))}</div>
    ${posNegShare()}
    <div><h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Topic-level competitive ownership <span class="normal-case text-muted-foreground/70">· who owns each conversation</span></h3>${topicsFull()}</div>
  </div>`;
}

/* ================= DETAIL PANELS ================= */
function openMention(id){
  const m=mentions.find(x=>x.id===id);if(!m)return;const p=PLAT[m.platform];
  el("detailHeader").innerHTML=`<span class="truncate text-sm font-semibold">${m.author}</span>${tierBadge(m.tier)}`;
  const eng=`<div class="grid grid-cols-3 gap-2">${[["Likes",fmtCount(m.likes)],["Comments",fmtCount(m.comments)],["Reach",fmtCount(m.reach)]].map(([l,v])=>`<div class="rounded-lg bg-muted/40 px-3 py-2"><p class="text-[10px] uppercase text-muted-foreground">${l}</p><div class="text-sm font-medium">${v}</div></div>`).join("")}</div>`;
  const comm=m.comm?`<section><h4 class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Comment analysis (${m.comm.analyzed})</h4>${sentimentBar(m.comm.dist)}<ul class="mt-3 space-y-1">${m.comm.top.map(c=>`<li class="text-sm text-muted-foreground">• ${c}</li>`).join("")}</ul></section>`:`<p class="text-sm text-muted-foreground">Comment volume below threshold — not aggregated.</p>`;
  el("detailBody").innerHTML=`<div class="space-y-6"><div class="flex items-center gap-2 text-xs text-muted-foreground"><span style="color:${p.color}">●</span>${p.label} · ${m.time} · ${m.sent}</div><p class="text-sm">${m.snippet}</p><div class="flex flex-wrap gap-1.5">${entBadge(m.entity)}<span class="rounded bg-secondary px-1.5 py-0.5 text-xs">${m.topic}</span></div><section><h4 class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Engagement</h4>${eng}</section>${comm}<div class="flex gap-2"><button data-act="reply" class="rounded-md border px-3 py-1.5 text-xs hover:bg-accent">Reply in Discussion ↗</button><button data-act="handle" class="rounded-md border px-3 py-1.5 text-xs hover:bg-accent">Mark handled</button></div></div>`;
  openPanel();
}
function openTopic(name){
  const tp=topics.find(x=>x.t===name);if(!tp)return;const net=netFromDist(tp.dist);
  el("detailHeader").innerHTML=`<span class="truncate text-sm font-semibold">${tp.t}</span>${momArrow(tp.mom)}`;
  const sample=mentions.filter(m=>m.topic===name).slice(0,3);
  el("detailBody").innerHTML=`<div class="space-y-6"><div class="grid grid-cols-2 gap-2">${[["Volume",fmtCount(tp.vol*periodInfo(state.period).scale)],["Net sentiment",(net>0?'+':'')+net.toFixed(2)]].map(([l,v])=>`<div class="rounded-lg bg-muted/40 px-3 py-2"><p class="text-[10px] uppercase text-muted-foreground">${l}</p><div class="text-sm font-medium">${v}</div></div>`).join("")}</div><section><h4 class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Sentiment</h4>${sentimentBar(tp.dist)}</section><section><h4 class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Competitive ownership</h4>${shareBar(tp.shares)}<div class="mt-2 space-y-1">${ENT.filter(e=>tp.shares[e.name]!=null).sort((a,b)=>tp.shares[b.name]-tp.shares[a.name]).map(e=>`<div class="flex items-center justify-between text-xs"><span class="inline-flex items-center gap-1.5"><span class="size-2 rounded-full" style="background:${e.color}"></span>${e.name}</span><span class="tabular text-muted-foreground">${pct(tp.shares[e.name])}</span></div>`).join("")}</div></section>${sample.length?`<section><h4 class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Sample mentions</h4><div class="space-y-1">${sample.map(m=>`<p class="text-sm text-muted-foreground">• ${m.snippet}</p>`).join("")}</div></section>`:""}</div>`;
  openPanel();
}
function openPanel(){el("detailOverlay").classList.remove("hidden");const p=el("detailPanel");p.classList.remove("hidden");requestAnimationFrame(()=>p.style.transform="translateX(0)");}
function closeDetail(){const p=el("detailPanel");p.style.transform="translateX(100%)";el("detailOverlay").classList.add("hidden");setTimeout(()=>p.classList.add("hidden"),200);}

/* ================= SETTINGS ================= */
function renderMon(){
  el("monBody").innerHTML=`
  <div class="border-b px-4 py-3"><div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">Coverage</div>
    <div class="mt-2 space-y-2 text-xs">
      <div class="rounded-lg bg-muted/30 px-3 py-2">Platforms: ${PLATFORMS.map(p=>p.label).join(" · ")}</div>
      <div class="rounded-lg bg-muted/30 px-3 py-2">Keywords active: 24 (brand 6 · competitor 9 · category 5 · custom 4)</div>
      <div class="text-[10px] text-muted-foreground">Last sync 40m ago</div>
    </div></div>
  <div class="border-b px-4 py-3"><div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">Monitoring</div><div class="mt-2 flex items-center justify-between rounded-lg bg-muted/40 px-3 py-2 text-sm"><span>Status</span><span class="flex items-center gap-2"><b class="text-green-600">On</b><span class="rounded border px-1 text-[10px] text-muted-foreground">managed by admin</span></span></div><p class="mt-1 px-1 text-[10px] text-muted-foreground">Enabling/disabling monitoring is controlled by your organization admin.</p></div>
  <div class="border-b px-4 py-3"><div class="text-[10px] font-medium uppercase tracking-wider text-muted-foreground">Notifications</div><div class="mt-2 space-y-1.5 text-sm"><label class="flex items-center justify-between rounded-lg px-2 py-1"><span>Email</span><input type="checkbox" data-notify="email" ${state.notifyEmail?"checked":""}></label><label class="flex items-center justify-between rounded-lg px-2 py-1"><span>Feishu</span><input type="checkbox" data-notify="feishu" ${state.notifyFeishu?"checked":""}></label></div></div>
  <div class="px-4 py-3"><button data-act="keywords" class="flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground">↗ Manage keywords & subscription</button></div>`;
}
function openMon(){renderMon();el("monOverlay").classList.remove("hidden");const p=el("monPanel");p.classList.remove("hidden");requestAnimationFrame(()=>p.style.transform="translateX(0)");}
function closeMon(){const p=el("monPanel");p.style.transform="translateX(100%)";el("monOverlay").classList.add("hidden");setTimeout(()=>p.classList.add("hidden"),200);}

/* ================= RENDER + EVENTS ================= */
function renderFilt(){
  const ents=["all",...ENT.map(e=>e.name)],tps=["all",...topics.map(t=>t.t)];
  const geos=["all",...Array.from(new Set(mentions.map(m=>m.geo)))],emos=["all",...Array.from(new Set(mentions.map(m=>m.emotion)))];
  const sec=(t,inner)=>`<div class="mb-4"><div class="mb-1.5 text-[10px] font-medium uppercase tracking-wide text-muted-foreground">${t}</div>${inner}</div>`;
  const sources=`<div class="grid grid-cols-2 gap-1">${PLATFORMS.map(p=>`<label class="flex cursor-pointer items-center gap-1.5 text-xs"><input type="checkbox" data-platcb="${p.k}" ${state.platforms.includes(p.k)?"checked":""}>${platDot(p.k)}${p.label}${p.viaVOC?'<span class="rounded border px-1 text-[8px] text-muted-foreground">VOC</span>':''}</label>`).join("")}</div>`;
  const sentF=`<div class="flex flex-wrap gap-1">${["all","positive","negative","mixed"].map(s=>`<button data-mentsent="${s}" class="rounded-md border px-2 py-0.5 text-[11px] ${state.mentSent===s?"bg-accent font-medium":"text-muted-foreground"}">${s==="all"?"All":s}</button>`).join("")}</div>`;
  const sel=(attr,val,opts)=>`<select ${attr} class="h-8 w-full rounded-md border bg-background px-2 text-xs">${opts.map(o=>`<option value="${o}" ${val===o?"selected":""}>${o==="all"?"All":o}</option>`).join("")}</select>`;
  const langSel=`<select data-langf class="h-8 w-full rounded-md border bg-background px-2 text-xs">${[["all","All languages"],["en","English"],["de","German"],["zh","Chinese"]].map(([v,l])=>`<option value="${v}" ${state.lang===v?"selected":""}>${l}</option>`).join("")}</select>`;
  const influence=`<input type="range" min="0" max="10" value="0" class="w-full"><div class="flex justify-between text-[9px] text-muted-foreground"><span>0</span><span>10 · demo</span></div>`;
  el("filtBody").innerHTML=sec("Sources",sources)+sec("Sentiment",sentF)+sec("Topic",sel("data-menttopic",state.mentTopic,tps))+sec("Influence score",influence)+sec("Geolocation",sel("data-mentgeo",state.mentGeo,geos))+sec("Emotion",sel("data-mentemotion",state.mentEmotion,emos))+sec("Language",langSel)+`<p class="text-[10px] text-muted-foreground">Filters apply across all tabs. Entity (own vs competitor) lives in the Mentions filter — Overview is always your brand.</p>`;
}
function openFilt(){renderFilt();el("filtOverlay").classList.remove("hidden");const p=el("filtPanel");p.classList.remove("hidden");requestAnimationFrame(()=>p.style.transform="translateX(0)");}
function closeFilt(){const p=el("filtPanel");p.style.transform="translateX(100%)";el("filtOverlay").classList.add("hidden");setTimeout(()=>p.classList.add("hidden"),200);}
function render(){renderTabbar();renderPeriod();const views={analysis:viewAnalysis,mentions:viewMentions,comparison:viewComparison,influencers:viewInfluencers};el("content").innerHTML=(views[state.tab]||viewAnalysis)();const fb=el("filtBtn");if(fb)fb.innerHTML=state.tab==="mentions"?(state.mentFiltOpen?'<span>⇥</span>Hide filters':'<span>⚑</span>Filters'):'<span>⚑</span>All Filters';if(!el("filtPanel").classList.contains("hidden"))renderFilt();}
document.addEventListener("click",(e)=>{
  const t=e.target.closest("[data-tab-btn],[data-period],[data-act],[data-sigact],[data-trendmetric],[data-ment],[data-mentsent],[data-mentchart],[data-day],[data-pubsort],[data-topic],[data-watch],[data-inflsub],[data-compmode],[data-compmetric],[data-compent],[data-permetric],[data-hotmode],[data-ovm],[data-drill],[data-authdrill]");
  if(!t)return;
  if(t.hasAttribute("data-tab-btn")){state.tab=t.getAttribute("data-tab");state.platOpen=false;render();return;}
  if(t.hasAttribute("data-period")){state.period=t.getAttribute("data-period");render();return;}
  if(t.dataset.trendmetric){state.trendMetric=t.dataset.trendmetric;render();return;}
  if(t.dataset.mentsent){state.mentSent=t.dataset.mentsent;render();return;}
  if(t.dataset.pubsort){state.pubSort=t.dataset.pubsort;render();return;}
  if(t.dataset.inflsub){state.inflSub=t.dataset.inflsub;render();return;}
  if(t.dataset.compmode){state.compMode=t.dataset.compmode;render();return;}
  if(t.dataset.compmetric){toggleArr(state.compMetrics,t.dataset.compmetric,1);render();return;}
  if(t.dataset.compent){toggleArr(state.compEntities,t.dataset.compent,1);render();return;}
  if(t.dataset.permetric){state.perMetric=t.dataset.permetric;render();return;}
  if(t.dataset.hotmode){state.hotMode=t.dataset.hotmode;render();return;}
  if(t.dataset.ovm){toggleArr(state.ovMetrics,t.dataset.ovm,1);render();return;}
  if(t.dataset.drill){state.platforms=[t.dataset.drill];state.mentDay=null;state.tab="mentions";toast("Showing mentions from "+(PLAT[t.dataset.drill]||{}).label);render();return;}
  if(t.dataset.authdrill){state.mentAuthor=t.dataset.authdrill;state.mentDay=null;state.tab="mentions";toast("Showing mentions from "+t.dataset.authdrill);render();return;}
  if(t.dataset.mentchart){state.mentChartMode=t.dataset.mentchart;render();return;}
  if(t.hasAttribute("data-day")){const d=t.getAttribute("data-day");state.mentDay=state.mentDay===d?null:d;render();return;}
  if(t.dataset.ment){openMention(t.dataset.ment);return;}
  if(t.dataset.topic){openTopic(t.dataset.topic);return;}
  if(t.dataset.watch){toast("Added "+t.dataset.watch+" to KOL watchlist ✓");return;}
  if(t.dataset.sigact){const s=signals.find(x=>x.id===t.dataset.id);if(s){s.status={ack:"acknowledged",resolve:"resolved",reopen:"active"}[t.dataset.sigact];toast("Signal updated");render();}return;}
  const act=t.dataset.act;
  if(act==="sync")toast("Social data synced ✓");
  if(act==="discover")toast("Discovered 3 new keywords ✓");
  if(act==="platopen"){state.platOpen=!state.platOpen;renderPlat();return;}
  if(act==="trendvs"){state.trendVsComp=!state.trendVsComp;render();}
  if(act==="sigmore"){state.sigExpanded=!state.sigExpanded;render();}
  if(act==="settings")openMon();
  if(act==="allfilters"){if(state.tab==="mentions"){state.mentFiltOpen=!state.mentFiltOpen;render();}else openFilt();}
  if(act==="closeFilt")closeFilt();
  if(act==="closeDetail")closeDetail();
  if(act==="closeMon")closeMon();
  if(act==="clearday"){state.mentDay=null;render();}
  if(act==="clearauthor"){state.mentAuthor="";render();}
  if(act==="askai")toast("Opening AI workspace to analyze (demo)");
  if(act==="reply")toast("Routing to Discussion to reply (demo)");
  if(act==="handle")toast("Marked handled ✓");
  if(act==="keywords")toast("Opening keyword subscription (demo)");
});
el("detailOverlay").addEventListener("click",closeDetail);
el("monOverlay").addEventListener("click",closeMon);
el("filtOverlay").addEventListener("click",closeFilt);
document.addEventListener("mouseover",(e)=>{const r=e.target.closest&&e.target.closest("[data-hoveridx]");if(!r)return;const svg=r.closest("svg");if(svg){svg.querySelectorAll(".hg").forEach(g=>g.style.display="none");const g=svg.querySelector('[data-hgi="'+r.getAttribute("data-hoveridx")+'"]');if(g)g.style.display="";}const tip=el("chartTip");const n2=r.getAttribute("data-n2");tip.innerHTML=`<div class="mb-1 font-medium">${r.getAttribute("data-lbl")}</div><div class="flex items-center gap-1.5"><span class="inline-block size-2 rounded-full" style="background:${r.getAttribute("data-c1")}"></span>${r.getAttribute("data-n1")}: <b class="ml-0.5">${r.getAttribute("data-v1")}</b></div>${n2?`<div class="mt-0.5 flex items-center gap-1.5"><span class="inline-block size-2 rounded-full" style="background:${r.getAttribute("data-c2")}"></span>${n2}: <b class="ml-0.5">${r.getAttribute("data-v2")}</b></div>`:""}`;tip.classList.remove("hidden");});
document.addEventListener("mousemove",(e)=>{const tip=el("chartTip");if(!tip||tip.classList.contains("hidden"))return;tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+14)+"px";});
document.addEventListener("mouseout",(e)=>{const r=e.target.closest&&e.target.closest("[data-hoveridx]");if(!r)return;const svg=r.closest("svg");if(svg)svg.querySelectorAll(".hg").forEach(g=>g.style.display="none");const tip=el("chartTip");if(tip)tip.classList.add("hidden");});
document.addEventListener("change",(e)=>{const t=e.target;
  if(t.dataset.langf){state.lang=t.value;render();}
  if(t.dataset.platcb){const k=t.dataset.platcb;const i=state.platforms.indexOf(k);if(i>=0){if(state.platforms.length>1)state.platforms.splice(i,1);}else state.platforms.push(k);render();}
  if(t.dataset.mentent){state.mentEntity=t.value;render();}
  if(t.dataset.menttopic){state.mentTopic=t.value;render();}
  if(t.dataset.brandcb){toggleArr(state.mentBrands,t.dataset.brandcb,0);render();}
  if(t.dataset.mentgeo){state.mentGeo=t.value;render();}
  if(t.dataset.mentemotion){state.mentEmotion=t.value;render();}
  if(t.dataset.notify){if(t.dataset.notify==="email")state.notifyEmail=t.checked;else state.notifyFeishu=t.checked;toast("Notification settings updated");}
});
render();
</script>
</body>
</html>
